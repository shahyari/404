name: Something is broken
description: An experience or part of the website doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a way around the sandbox, or another security problem? Please don't report it here. See [SECURITY.md](https://github.com/shahyari/404/blob/main/SECURITY.md).
  - type: input
    id: url
    attributes:
      label: Page
      description: The URL where it happens.
      placeholder: https://404.shahyari.com/packet-loss/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone 16, Firefox 145 on Windows 11
    validations:
      required: true
