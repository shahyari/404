<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Matrix Dial</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main>
    <h1 class="visually-hidden">404: Page not found. Crack the code to get out.</h1>

    <canvas
      tabindex="0"
      role="application"
      aria-roledescription="combination lock"
      aria-label="A combination lock made of rows of symbols, hiding the number 404. Use the up and down arrow keys to pick a row and the left and right arrow keys to turn it. A different tick sounds when a row lines up with the row above or below it. Line up every row to open it."></canvas>

    <a class="home" href="/" target="_top" data-home hidden>Return home</a>

    <button class="mute" type="button" aria-pressed="false" data-mute>Sound on</button>

    <p class="visually-hidden" aria-live="polite" data-announce></p>
  </main>
</body>
</html>
